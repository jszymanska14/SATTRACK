{% extends "base.html" %}
{% load static %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-astronaut"></i>
            <h1>Welcome Back</h1>
            <p>Sign in to access your satellite tracking dashboard</p>
        </div>

        <form method="post" action="{% url 'sign_in' %}" id="signinForm">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input id="email" name="email" type="email" class="form-control" placeholder="your@email.com" autocomplete="email">
                <div id="email-error" class="form-error"></div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
                <div id="password-error" class="form-error"></div>
            </div>

            <div id="submit-error" class="form-error" style="margin-bottom: 16px;"></div>

            <button id="submit-button" type="button" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'register' %}">Create one here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function getCookie(name) {
    let v = null;
    if (document.cookie && document.cookie !== "") {
        for (let c of document.cookie.split(";")) {
            c = c.trim();
            if (c.startsWith(name + "=")) { v = decodeURIComponent(c.slice(name.length + 1)); break; }
        }
    }
    return v;
}

function validateEmail(val) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val) && val.length <= 65;
}

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const emailError = document.getElementById("email-error");
const passwordError = document.getElementById("password-error");
const submitError = document.getElementById("submit-error");
let emailOk = false, passOk = false;

emailInput.addEventListener("blur", function() {
    if (!validateEmail(this.value)) { emailError.textContent = "Please enter a valid email address."; emailOk = false; }
    else { emailError.textContent = ""; emailOk = true; }
});

passwordInput.addEventListener("blur", function() {
    if (this.value.length < 5) { passwordError.textContent = "Password must be at least 5 characters."; passOk = false; }
    else { passwordError.textContent = ""; passOk = true; }
});

document.getElementById("submit-button").addEventListener("click", function() {
    emailOk = validateEmail(emailInput.value);
    passOk = passwordInput.value.length >= 5;
    if (!emailOk) emailError.textContent = "Please enter a valid email address.";
    if (!passOk) passwordError.textContent = "Password must be at least 5 characters.";

    if (emailOk && passOk) {
        submitError.textContent = "";
        fetch("/sign-in/", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": getCookie("csrftoken") },
            body: JSON.stringify({ email: emailInput.value, password: passwordInput.value })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === "success") window.location.href = data.redirect_url;
            else if (data.field === "email") emailError.textContent = data.message;
            else if (data.field === "password") passwordError.textContent = data.message;
            else submitError.textContent = data.message;
        })
        .catch(() => { submitError.textContent = "Connection error. Please try again."; });
    } else {
        submitError.textContent = "Please fill in all fields correctly.";
    }
});

</script>
{% endblock %}
